<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار تتبع العين</title><style>:root{font-family:Arial,Tahoma,sans-serif;color:#123d45}*{box-sizing:border-box}body{margin:0;background:transparent}.widget{width:100%;padding:12px}.camera{position:relative;background:#102f35;border-radius:15px;overflow:hidden;min-height:240px;display:grid;place-items:center}video{width:100%;max-height:420px;display:block;transform:scaleX(-1)}#placeholder{position:absolute;color:#d4e6e9;text-align:center;padding:15px}button{background:#20616b;color:white;border:0;border-radius:10px;padding:12px 22px;font-weight:bold;cursor:pointer;margin:12px 0 8px 8px}button.alt{background:#e7f0f1;color:#20555f}button:disabled{opacity:.5}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}.stat{background:#f4f7f8;border:1px solid #e7edef;border-radius:12px;text-align:center;padding:14px 6px;font-size:13px}.stat strong{display:block;font-size:24px;margin-top:8px}.note{font-size:12px;color:#75868e;line-height:1.8;margin:10px 0}.error{color:#b43232}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="widget"><div class="camera"><video id="video" autoplay playsinline muted></video><div id="placeholder">اضغط «تشغيل الكاميرا» لبدء الاختبار</div></div><button id="start">تشغيل الكاميرا</button><button id="stop" class="alt" disabled>إيقاف الكاميرا</button><div class="stats"><div class="stat">عدد الرمشات<strong id="blinks">0</strong></div><div class="stat">رمشة / دقيقة<strong id="rate">—</strong></div><div class="stat">مدة الاختبار<strong id="duration">00:00</strong></div><div class="stat">تتبع الوجه<strong id="tracking">—</strong></div></div><p id="message" class="note" aria-live="polite">يُحلّل الفيديو داخل متصفحك ولا يتم إرساله أو حفظه. النتائج تجريبية وليست تشخيصًا للإجهاد المعرفي.</p></div><script type="module">
import {FaceLandmarker,FilesetResolver} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm';
const $=x=>document.getElementById(x),v=$('video');let model,stream,running=false,raf=0,begin=0,count=0,closed=false,closedFrames=0,openFrames=0,lastBlink=0,lastFrame=-1;
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function ear(p,ids){const a=ids.map(i=>p[i]);return(d(a[1],a[5])+d(a[2],a[4]))/(2*d(a[0],a[3]));}
async function load(){if(model)return;const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');model=await FaceLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numFaces:1});}
function clock(){const s=Math.floor((performance.now()-begin)/1000);$('duration').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('rate').textContent=s>=10?(count*60/s).toFixed(1):'—';}
function loop(){if(!running)return;try{if(v.readyState>=2&&v.currentTime!==lastFrame){lastFrame=v.currentTime;const face=model.detectForVideo(v,performance.now()).faceLandmarks?.[0];if(face){$('tracking').textContent='متصل';const ratio=(ear(face,[33,160,158,133,153,144])+ear(face,[362,385,387,263,373,380]))/2;if(ratio<.19){closedFrames++;openFrames=0;if(closedFrames>=2)closed=true;}else if(ratio>.22){openFrames++;if(closed&&openFrames>=2&&performance.now()-lastBlink>250){count++;lastBlink=performance.now();$('blinks').textContent=count;}if(openFrames>=2){closed=false;closedFrames=0;}}}else{$('tracking').textContent='لا يوجد وجه';closed=false;closedFrames=0;openFrames=0;}}clock();}catch(e){$('message').textContent='خطأ أثناء التحليل: '+e.message;$('message').className='note error';stop();return;}raf=requestAnimationFrame(loop);}
async function start(){if(running)return;$('start').disabled=true;$('message').className='note';$('message').textContent='جارٍ تجهيز التتبع وطلب إذن الكاميرا...';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('يتطلب التشغيل HTTPS وإذن الكاميرا.');await load();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});v.srcObject=stream;await v.play();running=true;begin=performance.now();count=0;closed=false;closedFrames=0;openFrames=0;lastBlink=0;lastFrame=-1;$('blinks').textContent='0';$('rate').textContent='—';$('duration').textContent='00:00';$('placeholder').style.display='none';$('stop').disabled=false;$('message').textContent='الكاميرا تعمل. اجلس في إضاءة مناسبة. عتبات الرمش تجريبية وقد تحتاج معايرة.';loop();}catch(e){$('message').textContent='تعذر التشغيل: '+e.message;$('message').className='note error';stop();}}
function stop(){running=false;cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}v.pause();v.srcObject=null;$('placeholder').style.display='block';$('placeholder').textContent='الكاميرا متوقفة';$('tracking').textContent='—';$('start').disabled=false;$('stop').disabled=true;}
$('start').addEventListener('click',start);$('stop').addEventListener('click',stop);window.addEventListener('pagehide',stop);
</script></body></html>
